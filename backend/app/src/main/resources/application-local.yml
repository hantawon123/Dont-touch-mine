# 로컬 개발용. 여기 적힌 계정은 compose.local.yml이 띄우는 컨테이너 전용이며
# 개발자 PC 밖으로 나가지 않으므로 저장소에 그대로 둡니다.
spring:
  datasource:
    # 3307입니다. compose.local.yml이 호스트 3307에 물려 있습니다.
    url: jdbc:mysql://localhost:3307/d205?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: d205
    password: d205local

  jpa:
    show-sql: true


logging:
  level:
    com.ssafy.d205: debug
    org.hibernate.SQL: debug

# 로컬에서만 켭니다. http://localhost:8080/swagger-ui.html
# 여기서 누르는 요청은 compose.local.yml 이 띄운 컨테이너에만 씁니다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 로컬 전용 관리자 계정. 위 datasource 와 같은 판단입니다 - 개발자 PC 밖으로 나가지
# 않으므로 저장소에 둡니다. 운영은 .env 의 ADMIN_USERNAME / ADMIN_PASSWORD 를 씁니다.
admin:
  username: admin
  password: local-only
