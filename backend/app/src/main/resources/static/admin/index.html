<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개요 · D205</title>
<!--
  운영자용 신고 검토 화면.

  Thymeleaf 를 쓰지 않습니다. /api/v1/admin/reports 가 이미 JSON 을 주므로, 서버가
  HTML 까지 만들면 같은 데이터를 두 벌로 내보내게 됩니다.

  프레임워크도 빌드 도구도 없습니다. 화면이 셋뿐인데(로그인 · 목록 · 상세) node 와
  번들러와 별도 배포 대상이 따라옵니다. 화면이 커지면 그때 옮기면 됩니다.

  이 파일은 jar 에 같이 들어가고 nginx 가 / 를 8080 으로 넘기므로
  j15d205.p.ssafy.io/admin/ 에서 열립니다. 같은 출처라 CORS 설정이 없고 세션 쿠키가
  그대로 붙습니다.
-->
<style>
  :root {
    --ink: #1b1d21;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #f7f8fa;
    --card: #ffffff;
    --warn: #b91c1c;
    --ok: #15803d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font: 15px/1.6 "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--ink); background: var(--bg);
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px; margin-bottom: 12px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%; padding: 9px 11px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 7px; margin-bottom: 12px;
  }
  button {
    font: inherit; padding: 8px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: #fff; cursor: pointer;
  }
  button:hover { background: #f3f4f6; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.primary:hover { background: #33363c; }
  /* 되돌릴 수 없는 것만 빨갛습니다. 확인 창이 없으므로 색이 유일한 경고입니다.
     숨김까지 같이 칠하면 이 색이 "지운다"가 아니라 "치운다"로 읽혀 무뎌집니다. */
  button.danger { color: var(--warn); border-color: var(--warn); }
  button.danger:hover { background: #fdf2f2; }
  button:disabled { opacity: .5; cursor: default; }
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .who { flex: 1; min-width: 0; }
  .nick { font-weight: 600; }
  .counts { font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* 건수와 사람 수를 나란히 붙여 둡니다. 이 둘의 대비가 이 화면의 전부입니다 -
     "3건 1명"은 신고한 쪽이, "7건 5명"은 신고당한 쪽이 의심스럽다는 뜻입니다. */
  .counts b { font-size: 17px; }
  .counts .people { color: var(--muted); }
  .reasons { color: var(--muted); font-size: 13px; }
  .deleted { color: var(--warn); font-size: 12px; }
  /* 정지된 줄. 눈에 띄되 읽기는 방해하지 않을 만큼만 - 훑을 때 이미 조치한 사람을
     건너뛰게 하는 것이 목적이고, 그 줄의 신고 내용도 여전히 봐야 합니다. */
  .row.suspended { background: #fdf2f2; }
  .badge-suspended {
    display: inline-block; margin-right: 6px; padding: 1px 6px;
    border: 1px solid var(--warn); border-radius: 3px;
    color: var(--warn); font-size: 11px; font-weight: 600;
  }
  .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .actions { display: flex; gap: 6px; }
  .detail {
    margin: 10px 0 4px; padding: 12px 14px;
    background: var(--bg); border-radius: 8px; font-size: 14px;
  }
  .detail div { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .detail div:last-child { border-bottom: 0; }
  /* 사유는 늘어나고 버튼은 오른쪽에 붙습니다. 메모가 길어도 버튼 자리가 밀리지
     않도록 텍스트 쪽만 줄어들게 둡니다. */
  .entry { display: flex; align-items: center; gap: 10px; }
  .entry > span:first-child { flex: 1; min-width: 0; }
  .entry button { padding: 4px 9px; font-size: 13px; }
  .memo { color: var(--muted); }
  .notice { padding: 10px 12px; border-radius: 7px; font-size: 14px; margin-bottom: 12px; }
  .notice.bad { background: #fef2f2; color: var(--warn); }
  .notice.good { background: #f0fdf4; color: var(--ok); }
  .empty { color: var(--muted); padding: 28px 0; text-align: center; }
  .warnbar {
    background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
    padding: 10px 12px; border-radius: 7px; font-size: 13px; margin-bottom: 16px;
  }
  .tag {
    font-size: 11px; padding: 1px 6px; border-radius: 4px;
    background: var(--line); color: var(--muted); margin-left: 6px;
  }
  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .bar select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; font: inherit; }
  .grow { flex: 1; }
  .tabs { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  /* 지금 보고 있는 탭이 눌린 것처럼 보여야 합니다. 색만 다르면 어느 쪽이 켜진
     것인지 화면을 처음 보는 사람이 알 수 없습니다. */
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tab.on:hover { background: #33363c; }
  /* 피드백 한 건은 줄 하나가 아니라 덩어리입니다. 500자까지 오고 줄바꿈이 들어
     있으므로, 신고 줄처럼 가로로 늘어놓으면 읽을 수 없습니다. */
  .feedback { display: block; }
  .feedback .msg {
    margin-top: 6px; padding: 10px 12px; background: var(--bg);
    border-radius: 8px; white-space: pre-wrap; word-break: break-word;
  }
  .feedback .head { display: flex; align-items: baseline; gap: 8px; }
  .feedback .head .actions button { padding: 4px 9px; font-size: 13px; }
  .feedback .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .id { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  /* 사용자 줄. 이름 아래 한 줄에 가입일·접속 상태·마지막 접속을 작게 둡니다. 훑는 화면이라
     줄마다 세 줄을 차지하면 스크롤이 길어집니다. */
  .userline { color: var(--muted); font-size: 12px; }
  .userline .on { color: var(--ok); font-weight: 600; }
  .section { font-weight: 600; margin-top: 10px; padding-bottom: 2px; }
  .section:first-child { margin-top: 0; }
  .gone { color: var(--muted); font-style: italic; }
  .bar input { margin-bottom: 0; }
  /* 개요 탭. 숫자 카드는 한 줄에 여러 개, 차트는 카드 한 장에 하나입니다. */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .value small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .stat.dim .value { color: var(--muted); font-size: 14px; font-weight: 400; }
  .chart { position: relative; height: 240px; }
  .chart-title { font-weight: 600; margin-bottom: 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">신고 검토</h1>
  <div class="sub" id="who">확인하는 중…</div>

  <div id="notice" class="notice" hidden></div>

  <!-- 로그인 -->
  <div class="card" id="loginCard" hidden>
    <form id="loginForm">
      <label for="username">아이디</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">로그인</button>
    </form>
  </div>

  <!-- 로그인한 뒤 보이는 것. 탭 둘이 이 안에서 갈립니다. -->
  <div id="listView" hidden>
    <div class="tabs">
      <button id="tabOverview" class="tab on" type="button">개요</button>
      <button id="tabReports" class="tab" type="button">신고 검토</button>
      <button id="tabFeedback" class="tab" type="button">피드백</button>
      <button id="tabUsers" class="tab" type="button">사용자</button>
      <span class="grow"></span>
      <button id="logout">로그아웃</button>
    </div>

    <!-- 개요 -->
    <div id="overviewView">
      <div class="bar">
        <select id="range">
          <option value="24h">최근 24시간</option>
          <option value="7d">최근 7일</option>
        </select>
        <button id="refreshOverview">새로고침</button>
        <span class="grow"></span>
        <span class="when" id="overviewAt"></span>
      </div>
      <div class="cards" id="statCards"></div>
      <div class="card">
        <div class="chart-title">접속자</div>
        <div class="chart"><canvas id="presenceChart"></canvas></div>
      </div>
      <div class="card">
        <div class="chart-title">서버 자원</div>
        <div class="chart"><canvas id="resourceChart"></canvas></div>
      </div>
    </div>

    <!-- 신고 -->
    <div id="reportsView" hidden>
      <!--
        버튼이 무엇을 하는지 화면이 직접 말해야 합니다. "조치"라고만 적혀 있으면 운영자는
        누르는 순간 상대가 정지된 줄 압니다. 실제로는 신고에 표시만 남습니다.
      -->
      <div class="warnbar">
        표시만 남습니다. <b>계정 정지나 접속 차단 기능은 아직 없습니다.</b>
        신고당한 사람은 아무것도 알지 못합니다.
      </div>
      <div class="bar">
        <select id="status">
          <option value="PENDING">아직 안 본 신고</option>
          <option value="ACTIONED">문제 있다고 본 것</option>
          <option value="DISMISSED">문제 없다고 본 것</option>
        </select>
        <button id="refresh">새로고침</button>
      </div>
      <div class="card"><div id="rows"></div></div>
    </div>

    <!-- 피드백 -->
    <div id="feedbackView" hidden>
      <!--
        신고와 다른 사실을 적습니다. 여기서 할 수 있는 일은 읽는 것뿐이고, 그것을
        말해 두지 않으면 운영자가 답장이 가는 줄 알고 답을 씁니다.
      -->
      <div class="warnbar">
        읽는 것이 전부입니다. <b>답장할 경로가 없습니다.</b>
        읽음 표시도 없습니다 — 처리한 척하게 되기 때문입니다.
      </div>
      <div class="bar">
        <select id="limit">
          <option value="50">최근 50건</option>
          <option value="100">최근 100건</option>
          <option value="200">최근 200건</option>
        </select>
        <button id="refreshFeedback">새로고침</button>
      </div>
      <div class="card"><div id="feedbackRows"></div></div>
    </div>

    <!-- 사용자 -->
    <div id="usersView" hidden>
      <!--
        신고가 없는 사람도 여기서 찾아 정지할 수 있습니다. 검색 규칙이 게임 안 검색과
        다르다는 것을 적어 둡니다 - 운영자가 "게임에서는 안 나오는데 여기서는 나온다"를
        버그로 오해하지 않게 하려는 것입니다.
      -->
      <div class="warnbar">
        닉네임 <b>일부</b>로 찾고 대소문자를 구분합니다. userId 전체를 넣어도 됩니다.
        게임 안 검색과 달리 검색을 꺼 둔 사람도 나옵니다. 비워 두면 최근 가입순입니다.
      </div>
      <div class="bar">
        <input id="userQuery" class="grow" placeholder="닉네임 일부 또는 userId" autocomplete="off">
        <button id="searchUsers" class="primary">검색</button>
      </div>
      <div class="card"><div id="userRows"></div></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(() => {
  'use strict';

  const API = '/api/v1/admin';
  const el = (id) => document.getElementById(id);

  /**
   * 서버가 준 CSRF 토큰. 쿠키에서 읽어 헤더에 그대로 넣습니다.
   *
   * 서버가 섞지 않는 핸들러를 쓰도록 맞춰 두었습니다(SecurityConfig.rawCookieValue).
   * 기본 설정이면 쿠키 값과 서버가 기대하는 값이 달라 이 화면의 모든 처리 요청이
   * 403 이 됩니다.
   */
  function csrf() {
    const hit = document.cookie.split('; ').find((c) => c.startsWith('XSRF-TOKEN='));
    return hit ? decodeURIComponent(hit.slice('XSRF-TOKEN='.length)) : '';
  }

  function say(text, kind) {
    const box = el('notice');
    box.textContent = text;
    box.className = 'notice ' + (kind || 'bad');
    box.hidden = !text;
  }

  /** yyyyMMddHHmmss(UTC) 를 이 브라우저의 시각으로 읽습니다. */
  function when(stamp) {
    if (!stamp || stamp.length !== 14) return '';
    const iso = stamp.slice(0, 4) + '-' + stamp.slice(4, 6) + '-' + stamp.slice(6, 8)
      + 'T' + stamp.slice(8, 10) + ':' + stamp.slice(10, 12) + ':' + stamp.slice(12, 14) + 'Z';
    const at = new Date(iso);
    const ago = Math.floor((Date.now() - at.getTime()) / 60000);
    if (ago < 1) return '방금';
    if (ago < 60) return ago + '분 전';
    if (ago < 1440) return Math.floor(ago / 60) + '시간 전';
    return at.toLocaleDateString('ko-KR');
  }

  async function call(path, options) {
    const res = await fetch(API + path, Object.assign({
      headers: { 'X-XSRF-TOKEN': csrf(), 'Content-Type': 'application/json' },
    }, options));

    if (res.status === 401) {
      showLogin('로그인이 필요합니다.');
      throw new Error('unauthenticated');
    }

    // 403 은 CSRF 문제이기도 하고, 세션이 끊긴 상태이기도 합니다. CsrfFilter 가
    // 인가보다 먼저 돌아서, 로그인하지 않은 처리 요청은 401 이 아니라 여기로 옵니다.
    // 그래서 CSRF 문제로만 다루면 세션이 끊긴 사람이 로그인 화면에 못 갑니다.
    // 세션을 한 번 물어보고 갈라냅니다.
    if (res.status === 403) {
      const alive = await fetch(API + '/session');
      if (!alive.ok) {
        showLogin('로그인이 풀렸습니다. 다시 로그인해 주세요.');
      } else {
        say('요청이 거절되었습니다. 새로고침하고 다시 눌러 주세요.');
      }
      throw new Error('forbidden');
    }

    if (!res.ok) {
      let message = '요청을 처리하지 못했습니다.';
      try {
        const body = await res.json();
        if (body && body.message) message = body.message;
      } catch (ignored) { /* 본문이 없거나 JSON 이 아닐 수 있습니다. */ }
      say(message);
      throw new Error('failed');
    }

    return res.status === 204 ? null : res.json();
  }

  function showLogin(message) {
    el('who').textContent = '';
    el('loginCard').hidden = false;
    el('listView').hidden = true;
    if (message) say(message);
  }

  function showList(username) {
    el('who').textContent = username + ' 으로 로그인함';
    el('loginCard').hidden = true;
    el('listView').hidden = false;
  }

  function render(users) {
    const box = el('rows');
    box.textContent = '';

    if (!users.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '볼 신고가 없습니다.';
      box.appendChild(empty);
      return;
    }

    for (const user of users) {
      box.appendChild(rowOf(user));
    }
  }

  function rowOf(user) {
    const row = document.createElement('div');
    row.className = 'row';

    const who = document.createElement('div');
    who.className = 'who';

    const nick = document.createElement('div');
    nick.className = 'nick';
    nick.textContent = user.nickname;
    who.appendChild(nick);

    const reasons = document.createElement('div');
    reasons.className = 'reasons';
    reasons.textContent = Object.entries(user.reasons)
      .map(([name, count]) => name + ' ' + count).join(' · ');
    who.appendChild(reasons);

    if (user.fromDeletedAccounts > 0) {
      const gone = document.createElement('div');
      gone.className = 'deleted';
      // 몇 명이었는지는 복원할 수 없으므로 건수만 말합니다. 사람 수에 섞으면
      // 있지도 않은 신고자 수를 지어내게 됩니다.
      gone.textContent = '탈퇴한 계정의 신고 ' + user.fromDeletedAccounts + '건';
      who.appendChild(gone);
    }

    const counts = document.createElement('div');
    counts.className = 'counts';
    const total = document.createElement('b');
    total.textContent = user.reportCount + '건';
    const people = document.createElement('span');
    people.className = 'people';
    people.textContent = ' / ' + user.reporterCount + '명';
    counts.append(total, people);

    const time = document.createElement('div');
    time.className = 'when';
    time.textContent = when(user.lastReportedAt);

    const actions = document.createElement('div');
    actions.className = 'actions';

    // 치운 뒤 목록을 다시 그리면 이 줄은 버려지고 새 줄이 생깁니다. 펼쳐 둔 상태를
    // 되살리려면 새 줄에서 같은 사람을 찾아야 하므로 표시를 남겨 둡니다.
    row.dataset.userId = user.userId;

    // 이미 조치한 사람을 목록에서 바로 알아보게 합니다. 이것이 없으면 운영자가
    // 정지해 둔 사람을 다시 열어 보게 됩니다.
    if (user.suspended) {
      row.classList.add('suspended');
      const badge = document.createElement('span');
      badge.className = 'badge-suspended';
      badge.textContent = '정지됨';
      who.insertBefore(badge, reasons);
    }

    const open = document.createElement('button');
    open.textContent = '내용';
    open.className = 'detail-toggle';
    open.addEventListener('click', () => toggleDetail(row, user, open));
    actions.appendChild(open);

    if (el('status').value === 'PENDING') {
      // "조치"가 아니라 "문제 있음"입니다. 이 버튼은 제재를 실행하지 않고 판단만
      // 남깁니다. 실행하는 것처럼 적으면 운영자가 처리된 줄 알고 넘어갑니다.
      actions.appendChild(decide(user, 'ACTIONED', '문제 있음', true));
      actions.appendChild(decide(user, 'DISMISSED', '문제 없음', false));
    }

    // 사람 단위로 치웁니다. 판단과 나란히 두는 이유는 운영자가 같은 줄에서 "판단한다"
    // 와 "그냥 치운다"를 고르기 때문입니다. 숨김은 검토 상태를 건드리지 않습니다.
    //
    // status 를 함께 보냅니다. 이 줄의 건수는 지금 고른 상태의 것이므로, 상태를 빼고
    // 부르면 화면이 "1건"이라고 말한 자리에서 보이지도 않던 신고까지 사라집니다.
    // 삭제는 되돌릴 수 없어 그 차이가 그대로 손실이 됩니다.
    const target = '/reports/' + encodeURIComponent(user.userId);
    const scope = '?status=' + encodeURIComponent(el('status').value);
    actions.appendChild(cleanup('숨김', target + '/hidden' + scope, 'PATCH', load, false));
    actions.appendChild(cleanup('삭제', target + scope, 'DELETE', load, true));

    // 정지는 신고 기록이 아니라 계정을 건드리므로 경로가 다릅니다. 신고를 지워도
    // 정지는 남습니다(S15P21D205-927).
    actions.appendChild(suspension(user));

    row.append(who, counts, time, actions);
    return row;
  }

  function decide(user, status, label, primary) {
    const button = document.createElement('button');
    button.textContent = label;
    if (primary) button.className = 'primary';

    button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        const result = await call('/reports/' + encodeURIComponent(user.userId), {
          method: 'PATCH',
          body: JSON.stringify({ status: status }),
        });

        // 목록을 먼저 다시 그립니다. load 가 알림을 지우므로 순서가 반대면 방금 띄운
        // 문구가 그 자리에서 사라져, 운영자는 아무 확인도 받지 못합니다.
        await load();

        // 0 이면 그 사이에 다른 사람이 이미 처리한 것입니다. 오류가 아닙니다.
        say(result.reviewed > 0
          ? user.nickname + ' 신고 ' + result.reviewed + '건에 판단을 남겼습니다.'
          : '이미 판단이 남아 있었습니다.', 'good');
      } catch (ignored) {
        button.disabled = false;
      }
    });

    return button;
  }

  /**
   * 치우거나 지우는 버튼 하나.
   *
   * 숨김과 완전 삭제가 같은 모양을 쓰는 이유는 운영자에게 둘의 차이가 "다시 볼 수
   * 있는가"뿐이기 때문입니다. 되돌릴 수 없는 쪽만 danger 로 칠해 구분합니다.
   *
   * <b>확인 창이 없습니다.</b> 누르면 그 자리에서 실행됩니다. 삭제는 되돌릴 수 없고
   * 숨긴 것을 되살리려면 DB 를 열어야 하므로, 잘못 누르면 화면에서 할 수 있는 일이
   * 없습니다. 그렇게 하기로 정한 것입니다(S15P21D205-900).
   */
  /**
   * 정지 버튼. 이미 정지된 사람에게는 해제 버튼이 됩니다.
   *
   * 둘을 나란히 두지 않는 이유는, 그러면 지금 어느 쪽 상태인지를 버튼이 아니라
   * 다른 곳에서 읽어야 하기 때문입니다. 한 자리에 지금 할 수 있는 일만 둡니다.
   */
  /**
   * 정지·해제 버튼. 신고 탭과 사용자 탭이 같이 씁니다.
   *
   * @param done 처리 뒤 다시 그릴 목록. 기본은 신고 목록이고, 사용자 탭은 자기 목록을 넘깁니다.
   *             안 받으면 사용자 탭에서 누른 정지가 신고 목록을 새로 그리고 사용자 줄은 옛
   *             상태로 남습니다.
   */
  function suspension(user, done = load) {
    const button = document.createElement('button');
    const suspended = !!user.suspended;
    button.textContent = suspended ? '정지 해제' : '정지';
    if (!suspended) button.className = 'danger';

    button.addEventListener('click', async (event) => {
      event.stopPropagation();

      let reason = null;
      if (!suspended) {
        // 사유는 서버가 필수로 받습니다. 비워 보내면 400 이므로 여기서 먼저 막습니다.
        // 나중에 이 정지를 본 사람이 해제해도 되는지 판단할 유일한 근거이기도 합니다.
        reason = window.prompt(user.nickname + ' 계정을 정지합니다. 사유를 적으세요.');
        if (reason === null) return;
        if (!reason.trim()) {
          say('사유를 적어야 정지할 수 있습니다.', 'bad');
          return;
        }
        if (reason.length > 200) {
          say('사유는 200자를 넘을 수 없습니다.', 'bad');
          return;
        }
      }

      button.disabled = true;
      const path = '/users/' + encodeURIComponent(user.userId) + '/suspension';

      try {
        const result = suspended
          ? await call(path, { method: 'DELETE' })
          : await call(path, { method: 'PUT', body: JSON.stringify({ reason: reason }) });

        // 목록을 먼저 다시 그립니다. 그리는 쪽이 알림을 지우므로 순서가 반대면
        // 방금 띄운 문구가 그 자리에서 사라집니다.
        await done();

        // changed 가 false 면 그 사이에 다른 사람이 이미 바꿔 둔 것입니다. 오류가
        // 아니라 원하던 상태가 이미 되어 있는 것입니다.
        if (suspended) {
          say(result.changed ? user.nickname + ' 정지를 해제했습니다.' : '이미 정상 계정이었습니다.', 'good');
        } else {
          say(result.changed ? user.nickname + ' 계정을 정지했습니다.' : '이미 정지돼 있었습니다.', 'good');
        }
      } catch (ignored) {
        button.disabled = false;
      }
    });

    return button;
  }

  function cleanup(label, path, method, done, danger) {
    const button = document.createElement('button');
    button.textContent = label;
    if (danger) button.className = 'danger';

    button.addEventListener('click', async (event) => {
      // 지금은 줄이나 펼침 상자에 클릭 핸들러가 없어 이것이 없어도 동작이 같습니다.
      // 줄 전체를 눌러 펼치도록 바꿀 때 이 버튼이 그것까지 건드리지 않게 미리 막아
      // 둡니다. 그때 이 한 줄이 없으면 치우려던 클릭이 펼치기도 함께 실행합니다.
      event.stopPropagation();
      button.disabled = true;

      try {
        const result = await call(path, { method: method });

        // 목록을 먼저 다시 그립니다. 그리는 쪽이 알림을 지우므로 순서가 반대면
        // 방금 띄운 문구가 그 자리에서 사라집니다.
        await done();

        // 0 이면 그 사이에 다른 사람이 이미 치운 것입니다. 오류가 아닙니다.
        say(result.affected > 0 ? '치웠습니다.' : '이미 치워져 있었습니다.', 'good');
      } catch (ignored) {
        button.disabled = false;
      }
    });

    return button;
  }

  async function toggleDetail(row, user, button) {
    const open = row.nextElementSibling;
    if (open && open.classList.contains('detail')) {
      open.remove();
      button.textContent = '내용';
      return;
    }

    // 지금 보고 있는 상태만 펼칩니다. 미검토를 보다가 예전에 판단한 것까지 섞여
    // 나오면 지금 무엇을 정해야 하는지가 흐려집니다.
    const reports = (await call('/reports/' + encodeURIComponent(user.userId)
      + '?status=' + el('status').value)).reports;
    const box = document.createElement('div');
    box.className = 'detail';

    for (const report of reports) {
      const line = document.createElement('div');
      line.className = 'entry';

      const text = document.createElement('span');
      text.textContent = report.reason + ' · ' + when(report.createdAt);
      text.appendChild(memoOf(report));
      line.appendChild(text);

      // 건별로 치웁니다. 사람 단위로는 과한 경우 - 다섯 건 중 한 건만 스팸일 때 -
      // 를 위한 자리입니다. 치운 뒤에는 펼침을 다시 그려야 그 줄이 사라집니다.
      const entry = '/reports/entries/' + report.id;
      const redraw = () => reopenDetail(user);
      const actions = document.createElement('span');
      actions.className = 'actions';
      actions.appendChild(cleanup('숨김', entry + '/hidden', 'PATCH', redraw, false));
      actions.appendChild(cleanup('삭제', entry, 'DELETE', redraw, true));
      line.appendChild(actions);

      box.appendChild(line);
    }

    row.after(box);
    button.textContent = '접기';
  }

  /**
   * 펼쳐진 상세를 다시 그립니다.
   *
   * 목록부터 다시 불러야 합니다. 줄 하나만 지우면 바깥 목록의 건수가 그대로 남아
   * "3건"이라고 적힌 줄 아래에 두 건만 보이게 됩니다.
   *
   * 그러면 이 row 는 버려지므로, 새로 그려진 목록에서 같은 사람을 찾아 다시 펼칩니다.
   * 펼친 채로 두는 이유는 건별로 치우는 사람은 대개 연달아 누르기 때문입니다. 매번
   * 접히면 다섯 건 중 셋을 치우는 데 펼치기를 세 번 더 해야 합니다.
   */
  async function reopenDetail(user) {
    await load();

    // 그 사람의 마지막 한 건을 치웠으면 줄 자체가 사라집니다. 펼칠 대상이 없는 것이
    // 정상이고, 그때는 목록만 새로 그려진 채로 둡니다.
    const row = el('rows').querySelector('[data-user-id="' + CSS.escape(user.userId) + '"]');
    if (!row) {
      return;
    }

    await toggleDetail(row, user, row.querySelector('.detail-toggle'));
  }

  async function load() {
    say('');
    const status = el('status').value;
    render((await call('/reports?status=' + status)).users);
  }

  /**
   * 탭을 바꿉니다. 그리는 것은 부르는 쪽이 합니다.
   *
   * 어느 탭을 이미 읽었는지 기억하지 않습니다. 탭을 누를 때마다 다시 불러오면
   * "아까 본 목록"이 남아 있는 일이 없고, 이 화면의 조회는 둘 다 가볍습니다.
   */
  function showTab(name) {
    const tabs = {
      overview: ['overviewView', 'tabOverview', '개요'],
      reports: ['reportsView', 'tabReports', '신고 검토'],
      feedback: ['feedbackView', 'tabFeedback', '피드백'],
      users: ['usersView', 'tabUsers', '사용자'],
    };
    for (const key of Object.keys(tabs)) {
      const on = key === name;
      el(tabs[key][0]).hidden = !on;
      el(tabs[key][1]).classList.toggle('on', on);
    }
    // 파라미터가 name 이므로 여기서 name 을 다시 선언하면 안 됩니다. 같은 스코프의
    // 재선언은 런타임이 아니라 파스 단계에서 죽고, 그러면 이 script 블록이 통째로
    // 실행되지 않아 화면이 "확인하는 중…"에서 멈춥니다.
    const title = tabs[name][2];
    el('pageTitle').textContent = title;
    // 브라우저 탭 제목도 같이 바꿉니다. 창을 두 개 띄워 두면 제목이 유일한 구분입니다.
    document.title = title + ' · D205';
    say('');
  }

  async function loadFeedback() {
    say('');
    renderFeedback((await call('/feedback?limit=' + el('limit').value)).feedback);
  }

  function renderFeedback(items) {
    const box = el('feedbackRows');
    box.textContent = '';

    if (!items.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '들어온 피드백이 없습니다.';
      box.appendChild(empty);
      return;
    }

    for (const item of items) {
      box.appendChild(feedbackRowOf(item));
    }
  }

  /**
   * 피드백 한 건.
   *
   * <b>본문은 플레이어가 쓴 글입니다.</b> 이 화면에서 남이 쓴 글이 들어오는 첫
   * 자리이고, textContent 로만 넣습니다. innerHTML 로 바꾸는 순간 게임의 피드백
   * 입력창이 이 화면에 스크립트를 넣는 통로가 됩니다.
   */
  function feedbackRowOf(item) {
    const row = document.createElement('div');
    row.className = 'row feedback';

    const head = document.createElement('div');
    head.className = 'head';

    const who = document.createElement('span');
    if (item.nickname) {
      who.className = 'nick';
      who.textContent = item.nickname;
    } else {
      // userId 와 nickname 은 함께 비어 옵니다(탈퇴 시 작성자만 지웁니다).
      // 빈 자리를 그냥 두면 닉네임이 없는 계정처럼 읽힙니다.
      who.className = 'deleted';
      who.textContent = '탈퇴한 계정';
    }
    head.appendChild(who);

    if (item.userId) {
      // 앞 여덟 자만 보여 줍니다. 36자를 그대로 놓으면 닉네임이 두 줄로 밀리고,
      // 운영자가 한 사람의 여러 건을 알아보는 데는 여덟 자로 충분합니다.
      // 전체 값은 마우스를 올리면 나오고, 그대로 복사해 신고 조회에 넣을 수 있습니다.
      const id = document.createElement('span');
      id.className = 'id';
      id.textContent = item.userId.slice(0, 8);
      id.title = item.userId;
      head.appendChild(id);
    }

    const grow = document.createElement('span');
    grow.className = 'grow';
    head.appendChild(grow);

    const at = document.createElement('span');
    at.className = 'when';
    at.textContent = when(item.createdAt);
    head.appendChild(at);

    // 머리줄 끝에 답니다. 본문 아래에 두면 긴 피드백에서는 버튼이 화면 밖으로 밀려
    // 스크롤해야 보입니다. 치우려는 사람은 본문을 다 읽지 않고도 누릅니다.
    const target = '/feedback/' + item.id;
    const actions = document.createElement('span');
    actions.className = 'actions';
    actions.appendChild(cleanup('숨김', target + '/hidden', 'PATCH', loadFeedback, false));
    actions.appendChild(cleanup('삭제', target, 'DELETE', loadFeedback, true));
    head.appendChild(actions);

    row.appendChild(head);

    const message = document.createElement('div');
    message.className = 'msg';
    message.textContent = item.message;
    row.appendChild(message);

    // 빌드와 플랫폼이 없으면 그 줄을 아예 두지 않습니다. "빌드: -" 는 값이 없다는
    // 사실을 말하지 않고 자리만 차지합니다.
    const context = [item.buildVer, item.platform].filter(Boolean).join(' · ');
    if (context) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = context;
      row.appendChild(meta);
    }

    return row;
  }

  const PRESENCE = { OFFLINE: '오프라인', ONLINE: '온라인', IN_LOBBY: '로비', IN_GAME: '경기 중' };

  /* 개요 탭. 차트 객체는 탭을 오갈 때 다시 만들지 않고 데이터만 갈아 끼웁니다. */
  let presenceChart = null;
  let resourceChart = null;

  async function loadOverview() {
    say('');
    const data = await call('/overview?range=' + encodeURIComponent(el('range').value));
    renderCards(data.now, data.matches);
    renderCharts(data.series, data.range);
    el('overviewAt').textContent = '지금 값 기준 ' + new Date().toLocaleTimeString('ko-KR');
  }

  function card(label, value, unit, dim) {
    const box = document.createElement('div');
    box.className = 'stat' + (dim ? ' dim' : '');
    const l = document.createElement('div');
    l.className = 'label';
    l.textContent = label;
    const v = document.createElement('div');
    v.className = 'value';
    v.textContent = value;
    if (unit) {
      const u = document.createElement('small');
      u.textContent = unit;
      v.appendChild(u);
    }
    box.append(l, v);
    return box;
  }

  function renderCards(now, matches) {
    const box = el('statCards');
    box.textContent = '';
    const players = now.online + now.inLobby + now.inGame;
    box.append(
      card('접속자', players, '온라인 ' + now.online + ' · 로비 ' + now.inLobby + ' · 경기 ' + now.inGame),
      card('소켓 연결', now.socketConnections),
      card('전체 플레이어', now.totalUsers),
      card('오늘 가입 / 탈퇴', now.signupsToday + ' / ' + now.deletionsToday),
      card('미검토 신고', now.pendingReports),
      card('오늘 피드백', now.feedbackToday),
      card('정지 계정', now.suspendedUsers),
      card('CPU', now.cpuPct.toFixed(1), '%'),
      card('힙', now.heapUsedMb + ' / ' + now.heapMaxMb, 'MB'),
      card('DB 풀', now.dbPoolActive + ' / ' + now.dbPoolMax),
      // 분석 서비스가 분리되어 내부 API 가 생기면 채워지는 자리입니다(1002). 그때까지는 회색입니다.
      matches
        ? card('오늘 경기', matches.matchesToday, '진행 중 ' + matches.inProgress)
        : card('오늘 경기', '분리 후 연결', null, true),
    );
  }

  function labelOf(at) {
    // yyyyMMddHHmmss UTC → 한국 시간의 "일 시:분"
    const iso = at.slice(0, 4) + '-' + at.slice(4, 6) + '-' + at.slice(6, 8)
      + 'T' + at.slice(8, 10) + ':' + at.slice(10, 12) + ':' + at.slice(12, 14) + 'Z';
    const d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function lineChart(canvasId, existing, labels, datasets, yMax) {
    const options = {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom' } },
      scales: {
        x: { ticks: { maxTicksLimit: 8, maxRotation: 0 } },
        y: { beginAtZero: true, suggestedMax: yMax },
      },
    };
    if (existing) {
      existing.data.labels = labels;
      existing.data.datasets = datasets;
      existing.update();
      return existing;
    }
    return new Chart(el(canvasId), { type: 'line', data: { labels, datasets }, options });
  }

  function series(label, values, color, fill) {
    return { label, data: values, borderColor: color, backgroundColor: color + '33', fill: !!fill,
      pointRadius: 0, borderWidth: 1.5, tension: 0.2 };
  }

  function renderCharts(points, range) {
    const labels = points.map((p) => labelOf(p.at));
    presenceChart = lineChart('presenceChart', presenceChart, labels, [
      series('경기 중', points.map((p) => p.inGame), '#b91c1c', true),
      series('로비', points.map((p) => p.inLobby), '#d97706', true),
      series('온라인', points.map((p) => p.online), '#15803d', true),
      series('소켓', points.map((p) => p.socketConnections), '#1d4ed8'),
    ]);
    resourceChart = lineChart('resourceChart', resourceChart, labels, [
      series('CPU %', points.map((p) => p.cpuPct), '#b91c1c'),
      series('힙 MB', points.map((p) => p.heapUsedMb), '#1d4ed8'),
      series('DB 풀', points.map((p) => p.dbPoolActive), '#15803d'),
    ]);
    // 점이 없으면 서버가 꺼져 있었거나 방금 켜진 것입니다. 빈 차트보다 그 사실을 적습니다.
    if (!points.length) {
      say(range === '7d' ? '최근 7일 샘플이 없습니다. 서버가 1분마다 남깁니다.' : '최근 24시간 샘플이 없습니다. 서버가 1분마다 남깁니다.');
    }
  }

  async function loadUsers() {
    say('');
    const q = el('userQuery').value.trim();
    renderUsers((await call('/users?q=' + encodeURIComponent(q))).users);
  }

  function renderUsers(users) {
    const box = el('userRows');
    box.textContent = '';

    if (!users.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = el('userQuery').value.trim()
        ? '그런 사용자가 없습니다. 닉네임은 대소문자를 구분합니다.'
        : '사용자가 없습니다.';
      box.appendChild(empty);
      return;
    }

    for (const user of users) {
      box.appendChild(userRowOf(user));
    }
  }

  function userRowOf(user) {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.userId = user.userId;

    const who = document.createElement('div');
    who.className = 'who';

    const nick = document.createElement('div');
    nick.className = 'nick';
    if (user.suspended) {
      row.classList.add('suspended');
      const badge = document.createElement('span');
      badge.className = 'badge-suspended';
      badge.textContent = '정지됨';
      badge.title = user.suspendedReason || '';
      nick.appendChild(badge);
    }
    nick.appendChild(document.createTextNode(user.nickname));
    const id = document.createElement('span');
    id.className = 'id';
    id.textContent = ' ' + user.userId.slice(0, 8);
    id.title = user.userId;
    nick.appendChild(id);
    who.appendChild(nick);

    const line = document.createElement('div');
    line.className = 'userline';
    const presence = document.createElement('span');
    presence.textContent = PRESENCE[user.presence] || user.presence;
    if (user.presence && user.presence !== 'OFFLINE') presence.className = 'on';
    line.appendChild(presence);
    line.appendChild(document.createTextNode(
      ' · 가입 ' + when(user.createdAt)
      + (user.lastSeenAt ? ' · 마지막 ' + when(user.lastSeenAt) : '')));
    who.appendChild(line);

    const counts = document.createElement('div');
    counts.className = 'counts';
    // 신고 수를 굵게 둡니다. 이 화면에서 운영자가 먼저 보는 숫자입니다.
    const reports = document.createElement('b');
    reports.textContent = '신고 ' + user.reportCount;
    const friends = document.createElement('span');
    friends.className = 'people';
    friends.textContent = ' · 친구 ' + user.friendCount;
    counts.append(reports, friends);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const copy = document.createElement('button');
    copy.textContent = 'ID 복사';
    copy.addEventListener('click', async (event) => {
      event.stopPropagation();
      try {
        await navigator.clipboard.writeText(user.userId);
        say('userId 를 복사했습니다.', 'good');
      } catch (ignored) {
        // 클립보드 권한이 없는 브라우저입니다. 제목에 전체 값이 있으니 거기서 긁으면 됩니다.
        say('복사하지 못했습니다. 짧은 ID 위에 마우스를 올리면 전체 값이 보입니다.', 'bad');
      }
    });
    actions.appendChild(copy);

    const open = document.createElement('button');
    open.textContent = '상세';
    open.className = 'detail-toggle';
    open.addEventListener('click', () => toggleUserDetail(row, user, open));
    actions.appendChild(open);

    actions.appendChild(suspension(user, loadUsers));

    row.append(who, counts, actions);
    return row;
  }

  /**
   * 한 사람을 펼칩니다. 받은 신고, 한 신고, 보낸 피드백을 한 응답으로 받아 세 묶음으로 그립니다.
   *
   * 신고 탭의 상세와 달리 상대편(신고자 또는 신고당한 사람)을 보여줍니다. 운영자가 사람
   * 하나를 판단하는 자리라 누가 신고했는지가 필요합니다. 탈퇴한 상대는 이름 없이 남습니다.
   */
  async function toggleUserDetail(row, user, button) {
    const open = row.nextElementSibling;
    if (open && open.classList.contains('detail')) {
      open.remove();
      button.textContent = '상세';
      return;
    }

    const detail = await call('/users/' + encodeURIComponent(user.userId));
    const box = document.createElement('div');
    box.className = 'detail';

    section(box, '받은 신고 ' + detail.receivedReports.length + '건', detail.receivedReports,
      (r) => reportLine(r, '신고한 사람'));
    section(box, '한 신고 ' + detail.madeReports.length + '건', detail.madeReports,
      (r) => reportLine(r, '대상'));
    section(box, '보낸 피드백 ' + detail.feedback.length + '건', detail.feedback, (f) => {
      const line = document.createElement('div');
      line.textContent = when(f.createdAt)
        + ([f.buildVer, f.platform].filter(Boolean).length
          ? ' · ' + [f.buildVer, f.platform].filter(Boolean).join(' ') : '')
        + ' — ' + f.message;
      return line;
    });

    row.after(box);
    button.textContent = '접기';
  }

  function section(box, title, items, lineOf) {
    const head = document.createElement('div');
    head.className = 'section';
    head.textContent = title;
    box.appendChild(head);

    if (!items.length) {
      const none = document.createElement('div');
      none.className = 'gone';
      none.textContent = '없음';
      box.appendChild(none);
      return;
    }
    for (const item of items) {
      box.appendChild(lineOf(item));
    }
  }

  function reportLine(report, role) {
    const line = document.createElement('div');
    const text = document.createElement('span');
    text.textContent = report.reason + ' · ' + when(report.createdAt) + ' · ' + report.status + ' · ' + role + ' ';
    line.appendChild(text);

    const who = document.createElement('span');
    if (report.counterpartUserId) {
      who.textContent = report.counterpartNickname;
      who.title = report.counterpartUserId;
    } else {
      who.className = 'gone';
      who.textContent = '탈퇴한 계정';
    }
    line.appendChild(who);

    line.appendChild(memoOf(report));
    return line;
  }

  /**
   * 신고자가 적은 메모. 없으면 "메모 없음"이라고 흐리게 적습니다.
   *
   * 빈 자리로 두면 운영자가 메모라는 칸이 있다는 것 자체를 모릅니다. 사유는 고정 목록이라
   * 맥락이 없고, 그 맥락을 주는 것이 메모인데, 신고자가 안 적었다는 사실도 판단 재료입니다.
   */
  function memoOf(report) {
    const memo = document.createElement('span');
    memo.className = 'memo';
    memo.textContent = report.memo ? ' — ' + report.memo : ' — 메모 없음';
    if (!report.memo) memo.classList.add('gone');
    return memo;
  }

  el('loginForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    say('');

    // 폼 형식으로 보냅니다. Spring Security 의 필터가 직접 받기 때문입니다.
    // JSON 으로 보내면 아이디도 비밀번호도 읽히지 않아 조용히 401 이 됩니다.
    const body = new URLSearchParams({
      username: el('username').value,
      password: el('password').value,
    });

    const res = await fetch(API + '/session', { method: 'POST', body: body });
    if (!res.ok) {
      say('아이디 또는 비밀번호가 맞지 않습니다.');
      return;
    }

    el('password').value = '';
    await start();
  });

  el('logout').addEventListener('click', async () => {
    await fetch(API + '/logout', { method: 'POST', headers: { 'X-XSRF-TOKEN': csrf() } });
    showLogin('로그아웃했습니다.');
  });

  el('refresh').addEventListener('click', () => load().catch(() => {}));
  el('status').addEventListener('change', () => load().catch(() => {}));

  el('tabOverview').addEventListener('click', () => {
    showTab('overview');
    loadOverview().catch(() => {});
  });
  el('refreshOverview').addEventListener('click', () => loadOverview().catch(() => {}));
  el('range').addEventListener('change', () => loadOverview().catch(() => {}));

  el('tabReports').addEventListener('click', () => {
    showTab('reports');
    load().catch(() => {});
  });

  el('tabFeedback').addEventListener('click', () => {
    showTab('feedback');
    loadFeedback().catch(() => {});
  });

  el('refreshFeedback').addEventListener('click', () => loadFeedback().catch(() => {}));
  el('limit').addEventListener('change', () => loadFeedback().catch(() => {}));

  el('tabUsers').addEventListener('click', () => {
    showTab('users');
    loadUsers().catch(() => {});
  });

  el('searchUsers').addEventListener('click', () => loadUsers().catch(() => {}));
  el('userQuery').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      loadUsers().catch(() => {});
    }
  });

  async function start() {
    const res = await fetch(API + '/session');
    if (!res.ok) {
      showLogin('');
      return;
    }

    showList((await res.json()).username);

    // 개요로 시작합니다. 지금 몇 명이 붙어 있고 서버가 멀쩡한지가 열자마자 보여야 합니다.
    // 신고와 피드백은 눌러서 갑니다. 마지막에 본 탭을 기억하려면 저장할 곳이 필요한데
    // 그만한 값은 아닙니다.
    showTab('overview');
    await loadOverview();
  }

  start().catch(() => showLogin(''));
})();
</script>
</body>
</html>
