# 테스트 프로필 설정.
#
# 접속 상태 스윕을 사실상 끕니다. 스케줄러가 테스트 중에 돌면 하트비트를 과거로 밀어
# 크래시 상황을 만드는 테스트와 경합합니다. 저장된 status 가 아직 IN_GAME 인 것을
# 확인하는 사이에 스윕이 OFFLINE 으로 바꿔버리면 간헐적으로 실패하고, 그때 원인을
# 찾기가 어렵습니다.
#
# fixedDelay 는 기동 직후 한 번 돌고 그다음 이 간격을 셉니다. 기동 시점에는 데이터가
# 없어서 해가 없고, 한 시간 뒤에는 테스트가 이미 끝나 있습니다.
#
# 스윕 자체를 검증하는 테스트는 sweep() 을 직접 부르므로 이 설정과 무관합니다.
#
# 하트비트 갱신도 같은 이유로 끕니다. 이쪽은 반대 방향으로 경합합니다 — 하트비트를
# 과거로 밀어 크래시를 재현해 두면, 그 사용자가 아직 소켓에 붙어 있는 테스트에서
# 갱신이 하트비트를 현재로 되돌려 스윕이 아무것도 하지 않게 만듭니다.
#
# 갱신 자체를 검증하는 테스트는 refresh() 를 직접 부릅니다.
presence:
  sweep-interval-ms: 3600000
  heartbeat-refresh-ms: 3600000

# 초대 스윕도 같은 이유로 끕니다. 초대를 과거로 밀어 만료를 재현하는 테스트가
# 스윕과 겹치면, 만료된 초대가 목록에서 빠지는 것을 확인하려는 사이에 스윕이 행을
# 지워버려 무엇을 검증했는지 알 수 없게 됩니다.
invite:
  sweep-interval-ms: 3600000

# 운영 지표 샘플러와 스윕도 끕니다. 샘플러가 테스트 중에 돌면 "직전 샘플 이후 가입 수"의
# 기준 시각이 움직여 증분을 검증하는 테스트가 흔들립니다. 테스트는 sample() 과 sweep() 을
# 직접 부릅니다.
ops:
  sample-interval-ms: 3600000
  sweep-interval-ms: 3600000

# 익명화 재시도도 끕니다. 테스트가 retry() 를 직접 부릅니다. 주소는 가짜 서버를 띄우는 테스트가 동적으로
# 넣고, 나머지 테스트는 기본값(8081, 아무것도 없음)으로 가서 호출이 실패하는 상태를 봅니다.
analytics:
  erase-retry-ms: 3600000
  internal-key: test-internal-key

# OpenApiSpecTest 가 읽습니다. UI 까지 켜는 것은 로컬 설정(application-local.yml)이
# 실제로 동작하는지 검증하기 위한 것입니다. 경로 설정이 틀리면 아무 오류 없이 404 가
# 되어서, 클라이언트 담당자가 열어볼 때까지 아무도 모릅니다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 인증을 시험하려면 계정이 있어야 합니다. 값이 없으면 계정이 등록되지 않아
# 로그인 테스트가 "비밀번호가 틀렸다"가 아니라 "계정이 없다"로 실패하는데,
# 둘은 응답이 같아서 무엇이 잘못됐는지 알 수 없습니다.
admin:
  username: test-admin
  password: test-password


# HELLO 마감을 짧게 둡니다. 마감을 시험하는 테스트가 기본값 5초를 기다리면 스위트가 느려집니다.
# 정상 경로 테스트는 연결 직후 HELLO 를 보내므로 1초 안에 넉넉히 들어옵니다.
notifications:
  hello-timeout-ms: 1000

# 나간 SQL 문장을 세는 검사기입니다. 하트비트 갱신이 접속자 수와 무관하게 한 문장인지
# 확인하는 테스트가 씁니다(PresenceApiTest). 기본이 꺼짐이라 다른 테스트에는 boolean
# 검사 하나만 더해집니다. 자세한 이유는 StatementRecorder 의 주석에 있습니다.
spring:
  jpa:
    properties:
      hibernate:
        session_factory:
          statement_inspector: com.ssafy.d205.support.StatementRecorder
