# 백엔드 Gradle 설정. Jenkins 와 로컬이 같은 값을 씁니다.
#
# 이 파일은 Dockerfile 이 COPY 하지 않습니다. 이미지 안의 빌드는 레이어 캐시가 이미 모듈을 갈라
# 주고 있어 여기서 더 할 일이 없고, 컨테이너마다 새로 생기는 GRADLE_USER_HOME 에 캐시를 쌓아 봐야
# 다음 빌드가 쓰지 못합니다.

# 태스크 산출물을 GRADLE_USER_HOME 아래 공유 캐시에 저장하고 꺼내 씁니다.
#
# 노리는 것은 워크스페이스가 빈 빌드입니다. develop Job 은 워크스페이스가 계속 살아 있어 이미
# up-to-date 로 돌지만, MR 이 새로 열릴 때의 첫 빌드와 develop 머지 뒤 재트리거되는 MR 들은
# 건너뛸 것이 하나도 없어 매번 전부 컴파일하고 전부 테스트합니다. Jenkinsfile 의 when 조건으로는
# 해결되지 않습니다. 빈 워크스페이스에서는 조건을 걸어도 컴파일을 처음부터 해야 하기 때문입니다.
# Jenkins 의 모든 Job 이 같은 /var/lib/jenkins/.gradle 을 쓰므로 그 캐시를 서로 나눠 씁니다.
#
# 실측(빈 워크스페이스, 다른 경로): 2분 21초 -> 15초. app 소스만 바뀐 경우 1분 52초로, common 과
# analytics 몫이 전부 캐시에서 복원되고 app 테스트만 실제로 돕니다.
#
# 대가가 있습니다. 입력이 같으면 테스트를 실행하지 않고 통과를 복원하므로, 선언되지 않은 입력이
# 있으면 낡은 통과가 워크스페이스와 Job 을 가로질러 퍼집니다. 지금은 한 워크스페이스 안에 갇히는
# 문제가 전체로 번지는 것입니다. analytics/build.gradle 의 초기화 스크립트 입력 선언이 이 설정보다
# 먼저 들어간 이유입니다. 테스트를 새로 추가할 때 코드 밖의 파일을 읽는다면 입력으로 선언하세요.
# 캐시가 의심스러우면 /var/lib/jenkins/.gradle/caches/build-cache-1 을 지우거나 --rerun-tasks 로 돌립니다.
org.gradle.caching=true

# 구성 단계의 결과를 재사용합니다. CI 는 --no-daemon 이라 매 빌드가 구성을 처음부터 하고, 전부
# up-to-date 인 빌드에서는 그 비용만 남습니다. --no-daemon 기준 8~9초 -> 5~6초.
org.gradle.configuration-cache=true
