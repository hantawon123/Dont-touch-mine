# Jenkins systemd 드롭인.
# 배치 위치: /etc/systemd/system/jenkins.service.d/override.conf
#
# 패키지 기본값은 0.0.0.0:8080 입니다. 8080은 앱 컨테이너가 이미 쓰고 있고,
# Jenkins를 인터넷에 직접 노출할 이유도 없습니다. nginx가 443에서 받아
# /jenkins/ 를 이쪽으로 프록시합니다.
#
# 유닛의 ExecStart는 /usr/bin/jenkins 래퍼이고, 아래 변수들을 읽습니다.
# 패키지 유닛에 주석으로 나열돼 있는 지원 목록에서 가져온 이름입니다.

[Service]
# 앱과 충돌하지 않는 포트.
Environment="JENKINS_PORT=9090"

# 루프백에만 바인딩합니다. ufw가 9090을 막고 있지만 그것에만 의존하지
# 않습니다. Docker가 ufw를 우회하는 것에서 봤듯 방화벽은 절대적이지 않고,
# Jenkins는 docker 소켓 권한을 가지므로 뚫리면 호스트 전체가 넘어갑니다.
Environment="JENKINS_LISTEN_ADDRESS=127.0.0.1"

# nginx가 /jenkins/ 로 프록시하므로 Jenkins도 같은 프리픽스를 알아야 합니다.
# 없으면 Jenkins가 링크를 / 부터 생성해 로그인 이후 UI가 전부 깨집니다.
Environment="JENKINS_PREFIX=/jenkins"
