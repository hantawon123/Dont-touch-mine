# d205 백엔드 + Jenkins 리버스 프록시.
#
# certbot이 sites-available/default를 복제해 만든 블록 대신 이 파일을 씁니다.
# 같은 server_name으로 443 블록이 둘이면 nginx가 먼저 나온 것만 쓰고 나머지는
# 경고와 함께 무시하므로, 배포 시 default 심볼릭 링크를 내려야 합니다.
#
# 인증서 경로는 certbot이 관리하는 위치를 그대로 참조합니다. 갱신 시
# 파일이 교체되고 경로는 유지되므로 이 설정을 고칠 일은 없습니다.

server {
    listen 80;
    listen [::]:80;
    server_name j15d205.p.ssafy.io;

    # 인증서 갱신 챌린지만 80에서 처리하고 나머지는 443으로 넘깁니다.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24이므로 listen에 http2를 붙입니다.
    # http2 on; 은 1.25.1부터라 여기서는 문법 오류가 됩니다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name j15d205.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/j15d205.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15d205.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 기본값 1MB는 프로필 이미지 같은 요청에서 바로 걸립니다.
    client_max_body_size 10m;

    # Jenkins.
    # 경로 프리픽스 뒤에 두므로 Jenkins에도 --prefix=/jenkins가 있어야 합니다.
    # 없으면 Jenkins가 링크를 / 부터 생성해 로그인 이후 UI가 전부 깨집니다.
    #
    # proxy_pass에 경로를 붙이지 않는 것이 중요합니다. http://127.0.0.1:9090/ 처럼
    # 슬래시를 붙이면 /jenkins가 잘려나가 --prefix와 어긋납니다.
    location /jenkins/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # 콘솔 로그 스트리밍이 버퍼링에 걸려 빌드가 멈춘 것처럼 보입니다.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # 백엔드 애플리케이션.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
