# d205 백엔드 + Jenkins 리버스 프록시.
#
# certbot이 sites-available/default를 복제해 만든 블록 대신 이 파일을 씁니다.
# 같은 server_name으로 443 블록이 둘이면 nginx가 먼저 나온 것만 쓰고 나머지는
# 경고와 함께 무시하므로, 배포 시 default 심볼릭 링크를 내려야 합니다.
#
# 인증서 경로는 certbot이 관리하는 위치를 그대로 참조합니다. 갱신 시
# 파일이 교체되고 경로는 유지되므로 이 설정을 고칠 일은 없습니다.

server {
    listen 80;
    listen [::]:80;
    server_name j15d205.p.ssafy.io;

    # 인증서 갱신 챌린지만 80에서 처리하고 나머지는 443으로 넘깁니다.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24이므로 listen에 http2를 붙입니다.
    # http2 on; 은 1.25.1부터라 여기서는 문법 오류가 됩니다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name j15d205.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/j15d205.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15d205.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 기본값 1MB는 프로필 이미지 같은 요청에서 바로 걸립니다.
    client_max_body_size 10m;

    # WebGL is provisioned separately; an absent optional snippet is allowed.
    include /etc/nginx/snippets/d205-webgl*.conf;

    # Jenkins.
    # 경로 프리픽스 뒤에 두므로 Jenkins에도 --prefix=/jenkins가 있어야 합니다.
    # 없으면 Jenkins가 링크를 / 부터 생성해 로그인 이후 UI가 전부 깨집니다.
    #
    # proxy_pass에 경로를 붙이지 않는 것이 중요합니다. http://127.0.0.1:9090/ 처럼
    # 슬래시를 붙이면 /jenkins가 잘려나가 --prefix와 어긋납니다.
    location /jenkins/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # 콘솔 로그 스트리밍이 버퍼링에 걸려 빌드가 멈춘 것처럼 보입니다.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # 실시간 알림 WebSocket(/ws/notifications).
    #
    # Upgrade 와 Connection 헤더를 넘기지 않으면 nginx 가 일반 HTTP 로 취급해 핸드셰이크가
    # 400 으로 끝납니다. 읽기 타임아웃은 서버 ping 주기(30초)보다 길어야 하고, 아니면 조용한
    # 연결을 nginx 가 먼저 끊어 클라이언트가 이유 없이 재연결을 반복합니다.
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # 플레이 로그 수집. 이 주소 하나만 수집 서비스(8081)로 갑니다 (S15P21D205-980).
    #
    # = 로 정확히 맞춥니다. 접두사 매칭으로 두면 /api/v1/events-foo 같은 것도 딸려 갑니다.
    # 수집 서비스가 죽어 있으면 nginx 가 502 를 내고, 클라이언트는 그 배치를 스풀에 두었다가 다시 보냅니다.
    # 계정 서비스는 이 경로를 모르므로 여기 없으면 404 가 아니라 계정 서비스의 404 가 나가 원인을 찾기 어렵습니다.
    #
    # /internal/ 은 여기 없습니다. 그 경로는 compose 네트워크 안에서만 통하고 바깥에서는 계정 서비스의
    # 404 를 받습니다. 의도한 것입니다.
    location = /api/v1/events {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 계정 서비스. 나머지 전부.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Metabase(플레이 로그 대시보드). 같은 도메인의 두 번째 정문, 8443 입니다.
#
# Jenkins 처럼 /analytics/ 하위 경로에 두지 못합니다. Metabase 에는 JENKINS_PREFIX 같은 "나는
# 이 경로 아래에 산다" 설정이 없어서, 화면 안의 링크를 전부 /app/..., /api/... 로 만듭니다. 그 요청은
# 위 443 블록에서 게임 백엔드로 가서 404 가 됩니다. 첫 화면만 뜨고 나머지가 전부 깨지는 상태입니다.
# 하위 경로 지원은 Metabase 쪽에 여러 해 동안 열려 있는 요구입니다(metabase/metabase#11317 등).
#
# 포트를 바꾸면 이 블록 안에서는 Metabase 가 / 를 통째로 씁니다. 도메인과 인증서는 그대로입니다.
# ufw 와 EC2 보안 그룹에서 8443 을 열어야 하고, 보안 그룹은 2026-09-07 에 열었습니다.
#
# Basic Auth 를 앞에 겁니다. Metabase 에 자체 로그인이 있지만, 플레이 데이터 전체가 보이는 화면을
# Metabase 의 취약점 하나에만 맡기지 않으려는 것입니다. 비밀번호 파일은 deploy/README.md 대로
# 서버에서 htpasswd 로 만듭니다. 저장소에 두지 않습니다.
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name j15d205.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/j15d205.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15d205.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic           "d205 analytics";
    auth_basic_user_file /etc/nginx/.htpasswd-analytics;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host:8443;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host:8443;
        proxy_set_header X-Forwarded-Port  8443;

        # 무거운 쿼리는 오래 걸립니다. 앱의 60초로 두면 히트맵 집계가 중간에 끊깁니다.
        proxy_read_timeout 300s;
    }
}
