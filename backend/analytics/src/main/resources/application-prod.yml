# 운영용. 접속 정보는 값을 적지 않고 환경변수로만 받습니다. 변수가 빠진 채 배포되면 조용히 엉뚱한
# DB 에 붙는 대신 기동이 실패해서 즉시 드러나야 합니다.
#
# 변수 이름이 계정 서비스(DB_*)와 다른 것은 의도입니다. 같은 .env 파일에서 두 서비스가 읽으므로
# 이름이 같으면 두 DB 를 구분할 수 없습니다.
spring:
  datasource:
    url: jdbc:mysql://${ANALYTICS_DB_HOST}:${ANALYTICS_DB_PORT:3306}/${ANALYTICS_DB_NAME}?characterEncoding=UTF-8&serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${ANALYTICS_DB_USERNAME}
    password: ${ANALYTICS_DB_PASSWORD}

# nginx 가 443 에서 받아 프록시하므로 X-Forwarded-* 를 신뢰합니다. 레이트 리밋이 보는 클라이언트 IP 가
# 이 헤더에서 옵니다. 없으면 모든 요청이 nginx 의 127.0.0.1 로 보여 한 IP 취급이 됩니다.
server:
  forward-headers-strategy: native

logging:
  level:
    root: info
    com.ssafy.d205: info
