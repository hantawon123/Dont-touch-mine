# Included in the existing HTTPS server block by d205-client*.conf.
location = /download { return 302 /download/; }
location /download/ {
    proxy_pass http://127.0.0.1:4292/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_redirect off;
}

# Replace the old d205-webgl /play locations and its maintenance snippet
# only after a validated desktop release is active. Never include both routes.
location = /play { return 302 /play/; }
location /play/ {
    proxy_pass http://127.0.0.1:4292/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_redirect /download/ /play/;
}
