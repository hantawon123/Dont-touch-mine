# Included in the existing HTTPS server block by d205-client*.conf.
location = /download { return 302 /download/; }
location /download/ {
    proxy_pass http://127.0.0.1:4292/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_redirect off;
}
