# Place selection v2 (observation place-obs-v2-63, 4 discrete actions = choose one of 4 spots).
# One decision per episode (a contextual bandit), so gamma barely matters.
# No physical bot and no Fusion: the editor time-scale actually speeds this up.
# Keep this file ASCII: mlagents-learn reads it with the Windows default code page.
# max_steps is a first guess; adjust after measuring decisions/s in the diagnostic run.
behaviors:
  PlaceSelect:
    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    checkpoint_interval: 50000
    keep_checkpoints: 10
    max_steps: 500000
    time_horizon: 16
    summary_freq: 5000
