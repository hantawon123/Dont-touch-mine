# Hide-seek v1: asymmetric self-play (docs/planning/hide-seek-v1.md).
# HideSelect = team 0 (obs hideseek-obs-v1, 152 floats, 9 actions), about 1-2 decisions per round.
# SeekSelect = team 1 (89 floats, 12 actions), about 16 decisions per round (measured in the smoke run).
# Self-play step counts are in each behavior's own decisions, so the hider numbers are ~12x smaller;
# both are sized to about 7,500 rounds per team change and ~400 rounds per opponent snapshot swap.
# Rewards are zero-sum in [-1, 1]; the ELO reads their sign as win / loss.
# max_steps are matched (250k hider ~ 3.2M seeker in run hs-v1-b3) so both finish together: once one side
# stops, its team-change turns train nobody.
# Keep this file ASCII: mlagents-learn reads it with the Windows default code page.
behaviors:
  HideSelect:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    self_play:
      save_steps: 2000
      team_change: 10000
      swap_steps: 500
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    checkpoint_interval: 20000
    keep_checkpoints: 20
    max_steps: 250000
    time_horizon: 16
    summary_freq: 2000

  SeekSelect:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    self_play:
      save_steps: 24000
      team_change: 120000
      swap_steps: 6400
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    checkpoint_interval: 200000
    keep_checkpoints: 20
    max_steps: 3200000
    time_horizon: 64
    summary_freq: 20000
