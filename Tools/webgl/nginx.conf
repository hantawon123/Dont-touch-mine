# Include inside the existing HTTPS server. API/Jenkins routes stay separate.
# Keep the maintenance include enabled until public validation is scheduled.
location = /play { return 302 /play/; }
location /play/ {
    proxy_pass http://127.0.0.1:4292/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_redirect off;
}
