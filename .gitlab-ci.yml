stages:
  - notify

mattermost-merge-notification:
  stage: notify
  image: python:3.13-alpine
  rules:
    - if: '$MATTERMOST_WEBHOOK_URL && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(develop|release|main)$/ && $CI_COMMIT_TITLE =~ /^Merge branch /'
  script:
    - |
      python - <<'PY'
      import json
      import os
      import urllib.request

      commit_url = f'{os.environ["CI_PROJECT_URL"]}/-/commit/{os.environ["CI_COMMIT_SHA"]}'
      message = (
          f'✅ **{os.environ["CI_PROJECT_PATH"]} 병합 완료**\n'
          f'- 대상: `{os.environ["CI_COMMIT_BRANCH"]}`\n'
          f'- 내용: {os.environ["CI_COMMIT_TITLE"]}\n'
          f'- 작업자: {os.environ.get("GITLAB_USER_NAME", "unknown")}\n'
          f'- [커밋 보기]({commit_url})'
      )
      request = urllib.request.Request(
          os.environ['MATTERMOST_WEBHOOK_URL'],
          data=json.dumps({'text': message}).encode(),
          headers={'Content-Type': 'application/json'},
      )
      with urllib.request.urlopen(request, timeout=10) as response:
          print(f'Mattermost notification sent: HTTP {response.status}')
      PY
